# SkiPro automatic deployment - laboratory work 6
name: Deploy static site

# Запуск при изменениях в ветке main
on:
  push:
    branches:
      - main

  # Дополнительная возможность ручного запуска
  workflow_dispatch:

# Необходимые разрешения
permissions:
  contents: read
  pages: write
  id-token: write

# Предотвращение конкурирующих публикаций
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Получение файлов репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Validate website structure
        shell: bash
        run: |
          test -s index.html
          test -s style.css
          test -d "Изображения"
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -qi 'href="style.css"' index.html
          echo "Website structure check passed"
          
      # Настройка GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Подготовка файлов сайта
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      # Публикация сайта
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
